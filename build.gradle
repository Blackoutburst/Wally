buildscript {
    ext.kotlin_version = '1.7.0-RC'
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}
plugins {
	id 'application'
	id 'com.github.johnrengelman.shadow' version '5.2.0'
}
apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'maven'
project.setProperty("mainClassName", "com.blackoutburst.wally.main.Main")
application {
	mainClass = 'main.Main'
}

dependencies {
  implementation 'com.google.guava:guava:31.1-jre'
  implementation 'com.google.code.gson:gson:2.9.0'
  implementation 'net.dv8tion:JDA:5.0.0-alpha.12'
  implementation 'org.apache.logging.log4j:log4j-slf4j-impl:2.17.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
}

allprojects {
	repositories {
		mavenCentral()
		maven {
		name 'm2-dv8tion'
		url 'https://m2.dv8tion.net/releases'
		}
		maven { url 'https://jitpack.io' }
	}
}

sourceSets {
	main {
		java {
			srcDir 'src/'
		}
	}
}

jar {
	manifest {
		attributes(
			'Main-Class': 'com.blackoutburst.wally.main.Main'
		)
	}
}

shadowJar {
	baseName = project.name
	version = project.version
	manifest {
		attributes 'Main-Class': 'com.blackoutburst.wally.main.Main'
	}		
}

task sourcesJar(type: Jar, dependsOn: classes) {
	classifier = 'sources'
	from sourceSets.main.allSource
}

artifacts {
	archives sourcesJar
	archives shadowJar
}
repositories {
    mavenCentral()
}
compileKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
compileTestKotlin {
    kotlinOptions {
        jvmTarget = "1.8"
    }
}
