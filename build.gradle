plugins {
	id 'application'
	id 'com.github.johnrengelman.shadow' version '5.2.0'
}
apply plugin: 'java'
apply plugin: 'maven'
project.setProperty("mainClassName", "com.blackoutburst.wally.main.Main")
application {
	mainClass = 'main.Main'
}

sourceCompatibility = 1.8 // java 8
targetCompatibility = 1.8

dependencies {
  implementation 'com.google.guava:guava:29.0-jre'
  implementation 'com.google.code.gson:gson:2.9.0'
  implementation 'net.dv8tion:JDA:5.0.0-alpha.9'

}

allprojects {
	repositories {
		mavenCentral()
		maven {
		name 'm2-dv8tion'
		url 'https://m2.dv8tion.net/releases'
		}
		maven { url 'https://jitpack.io' }
	}
}

sourceSets {
	main {
		java {
			srcDir 'src/'
		}
	}
}

jar {
	manifest {
		attributes(
			'Main-Class': 'com.blackoutburst.wally.main.Main'
		)
	}
}

shadowJar {
	baseName = project.name
	version = project.version
	manifest {
		attributes 'Main-Class': 'com.blackoutburst.wally.main.Main'
	}		
}

task sourcesJar(type: Jar, dependsOn: classes) {
	classifier = 'sources'
	from sourceSets.main.allSource
}

artifacts {
	archives sourcesJar
	archives shadowJar
}
